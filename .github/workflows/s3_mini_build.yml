name: S3_Mini_Build_DOCKER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Bu satır sihirli değnektir; her şeyi hazır kurulu olan odayı getirir
    container: ardupilot/ardupilot-dev-esp32:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Firmware
        shell: bash
        run: |
          # Bu ortamda her şey zaten yüklü, sadece derliyoruz
          git config --global --add safe.directory /__w/ardupilot/ardupilot
          ./waf configure --board esp32s3devkit
          ./waf plane

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3-Mini-ArduPlane-Firmware
          path: |
            build/esp32s3devkit/bin/ardplane.bin
            build/esp32s3devkit/bin/bootloader.bin
            build/esp32s3devkit/bin/partition-table.bin
