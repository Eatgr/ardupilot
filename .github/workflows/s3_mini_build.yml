name: S3_Mini_Build_V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel
          pip3 install empy==3.3.4 pexpect

      - name: Configure
        run: |
          ./waf configure --board esp32s3devkit

      - name: Build Plane
        run: |
          ./waf plane

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3-Mini-ArduPlane
          path: |
            build/esp32s3devkit/bin/ardplane.bin
            build/esp32s3devkit/bin/bootloader.bin
            build/esp32s3devkit/bin/partition-table.bin
