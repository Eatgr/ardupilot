name: S3_Mini_Build_V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Tools and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel
          # ArduPilot'un ESP32 araçlarını kuran özel komut
          ./Tools/environment_install/install-prereqs-ubuntu.sh -y
          # Bıçakların (Toolchain) yerini robotun beynine (PATH) kazı
          echo "$HOME/opt/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure and Build
        run: |
          # Burada artık PATH otomatik olarak tanınacak
          ./waf configure --board esp32s3devkit
          ./waf plane

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3-Mini-ArduPlane-Firmware
          path: |
            build/esp32s3devkit/bin/ardplane.bin
            build/esp32s3devkit/bin/bootloader.bin
            build/esp32s3devkit/bin/partition-table.bin
