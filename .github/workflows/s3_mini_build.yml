name: S3_Mini_Build_V11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Düzeltildi: Burası artık kesin doğru!
        with:
          submodules: 'recursive'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3-pip python3-setuptools libserialport-dev
          pip3 install empy==3.3.4 pexpect future ninja cmake

      - name: Download ESP32-S3 Toolchain
        run: |
          wget https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.xz
          tar -xf xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.xz
          # Bıçakların (Toolchain) tam yolunu sisteme tanıtıyoruz
          echo "$GITHUB_WORKSPACE/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH

      - name: Configure and Build (Tek Blok - Hatasız)
        run: |
          # Bütün gizli yolları tek tek robotun beynine işliyoruz
          export PATH="$GITHUB_WORKSPACE/xtensa-esp32s3-elf/bin:$PATH"
          export PATH="$HOME/.local/bin:$PATH"
          export CMAKE_GENERATOR="Ninja"
          export CMAKE_MAKE_PROGRAM=$(which ninja)
          
          # ArduPilot'un ESP32 sistemi için kritik "Board Root" tanımı
          ./waf configure --board esp32s3devkit
          
          # Uçak yazılımını pişiriyoruz
          ./waf plane
